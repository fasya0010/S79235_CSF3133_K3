
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main heading -->
    <h2>Student Grade Calculator</h2>

    <!-- Student grade form -->
    <form name="gradeForm" onsubmit="return checkMark()">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name">

        <br><br>

        <label for="mark">Mark (0-100):</label>
        <input type="text" id="mark" name="mark"
               placeholder="Enter your mark">

        <br><br>

        <button type="submit">Check Grade</button>

        <!-- Random mark button -->
        <button type="button" onclick="randomMark()">
            Random Mark
        </button>

    </form>

    <!-- Display grade result -->
    <p id="result"></p>

    <!-- Display date and time -->
    <p id="checkTime"></p>

    <!-- Display grade table -->
    <button onclick="showTable()">Show Grade Table</button>

    <div id="tableContainer"></div>

    <!-- Link external JavaScript -->
    <script src="grade.js"></script>

</body>
</html>
