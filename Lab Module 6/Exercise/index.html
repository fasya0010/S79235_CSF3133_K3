<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Web Dev Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Header introducing the quiz -->
        <header>
            <h1>Web Development Quiz</h1>
            <p>Test your HTML, CSS, and JavaScript knowledge before the timer runs out!</p>
        </header>

        <main>
            <!-- Section for Timer, Questions, and Answer Options -->
            <section id="quiz-section">
                <div class="quiz-header-bar">
                    <span id="question-progress">Question 1 of 5</span>
                    <div id="timer-box">Time Left: <span id="time-left">15</span>s</div>
                </div>

                <h2 id="question-text">Question will appear here</h2>
                
                <div id="options-container" class="options-grid">
                    <!-- Option buttons are dynamically generated by JavaScript -->
                </div>
            </section>

            <!-- Section to show real-time feedback -->
            <section id="feedback-section" class="hidden">
                <p id="feedback-text"></p>
            </section>

            <!-- Navigation and Submit Controls -->
            <section class="controls-section">
                <button id="submit-btn" class="btn primary-btn" disabled>Submit Answer</button>
                <button id="next-btn" class="btn secondary-btn hidden">Next Question</button>
                <button id="restart-btn" class="btn primary-btn hidden">Restart Quiz</button>
            </section>
        </main>

        <!-- Footer displaying the score -->
        <footer>
            <p id="score-display">Current Score: 0</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
